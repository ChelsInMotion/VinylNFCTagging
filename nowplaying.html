<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyl</title>
<style>
  /* THE SLEEVE, merged. Left rail: art, sleeve-back, side tracklist, needle.
     Right: title headline + lyrics pane. Posture (solo|party) is latched per
     side. Every size is a vmin/vh/vw multiple of --u: no fixed-px type. */
  :root {
    --u: 1vmin;
    --bg: #070707;
    --ink: #f2eee8;          /* warm off-white, never #fff */
    --sub: #c4bdb2;
    --dim: #8f887d;
    --faint: #4a4741;
    --accent: #c8a15a;       /* re-tinted from the art */
    --art-glow: rgba(0,0,0,0);
    --art-max: 100vw;        /* set from the cover's native size (<= ~1.75x) */
    --pad: calc(var(--u) * 4.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(130vmax 100vmax at 30% 40%, var(--art-glow), transparent 60%), var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    position: fixed; inset: 0; overflow: hidden;
    transition: background 1.6s ease;
  }

  /* blurred backdrop of the same art (party only) */
  #bg { position: fixed; inset: 0; overflow: hidden; opacity: 0; transition: opacity 1.5s; z-index: 0; }
  #bg img { width: 100%; height: 100%; object-fit: cover; filter: blur(calc(var(--u) * 5)) brightness(.38) saturate(1.2); transform: scale(1.2); }
  body.party #bg { opacity: 1; }
  body.idle #bg, body[data-view="boot"] #bg { opacity: 0; }

  /* ---------- stage ---------- */
  #stage {
    position: relative; z-index: 1;
    display: grid; height: 100vh; width: 100vw;
    padding: var(--pad); gap: var(--pad);
    grid-template-columns: minmax(0, 34vw) minmax(0, 1fr);
    transition: opacity 1.2s;
  }
  body.idle #stage, body[data-view="boot"] #stage { opacity: 0; pointer-events: none; }

  /* ---- left rail ---- */
  #rail { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: calc(var(--u) * 2.2); }
  #art-wrap {
    position: relative; flex: 0 0 auto;
    width: min(100%, 56vh, var(--art-max)); aspect-ratio: 1 / 1;
    border-radius: calc(var(--u) * 1); overflow: hidden; background: #141210;
    box-shadow: 0 calc(var(--u) * 2.2) calc(var(--u) * 6) rgba(0,0,0,.75);
  }
  #art { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .8s; }
  #art.on { opacity: 1; }

  #sleeve { font-size: calc(var(--u) * 1.8); color: var(--dim); line-height: 1.5; }
  #sleeve:empty { display: none; }

  #sides { overflow: hidden; min-height: 0; flex: 1 1 auto; }
  .side-h { font-size: calc(var(--u) * 1.5); letter-spacing: .22em; text-transform: uppercase;
            color: var(--faint); margin: 0 0 calc(var(--u) * .8); }
  .trk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * 1.4);
         font-size: calc(var(--u) * 2); color: var(--dim); padding: calc(var(--u) * .35) 0; white-space: nowrap; }
  .trk .t { overflow: hidden; text-overflow: ellipsis; }
  .trk .d { color: var(--faint); font-variant-numeric: tabular-nums; }
  .trk.done { color: var(--faint); }
  .trk.now { color: var(--ink); }

  /* needle rail: fill = position in track, ticks = the side's track boundaries */
  #needle { display: flex; align-items: center; gap: calc(var(--u) * 1.2); flex: 0 0 auto;
            font-size: calc(var(--u) * 1.6); color: var(--dim); font-variant-numeric: tabular-nums; }
  #needle:empty, #needle.off { visibility: hidden; }
  #bar { position: relative; flex: 1; height: calc(var(--u) * .7); background: #1d1b18; border-radius: calc(var(--u) * .4); }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: inherit;
          transition: width 1s linear; }
  #bar u { position: absolute; top: calc(var(--u) * -.3); bottom: calc(var(--u) * -.3); width: calc(var(--u) * .25);
           background: var(--faint); text-decoration: none; }

  /* ---- main column ---- */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #id { flex: 0 0 auto; margin-bottom: calc(var(--u) * 2); min-width: 0; }
  #track { font-size: calc(var(--u) * 7.4); font-weight: 700; line-height: 1.06; letter-spacing: -.02em;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #artist { font-size: calc(var(--u) * 3.2); font-weight: 500; color: var(--sub); margin-top: calc(var(--u) * 1);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { font-size: calc(var(--u) * 2.4); color: var(--dim); margin-top: calc(var(--u) * .4);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #id > div { transition: opacity .3s; }
  #id.swap > div { opacity: 0; }

  /* ---- pane: synced hero > plain block > tracklist (in-flight / miss) ---- */
  #pane { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #pane[data-state="synced"] #lyr-scroll, #pane[data-state="plain"] #lyr-scroll {
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent); }
  #lyr-scroll { height: 100%; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
  #lyr-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
  #lyr-inner { padding: 30vh 0; }
  #pane[data-state="plain"] #lyr-inner { padding: calc(var(--u) * 6) 0; }
  #pane[data-state="flight"] #lyr-scroll, #pane[data-state="miss"] #lyr-scroll { display: none; }
  .ln { font-size: calc(var(--u) * 3.6); font-weight: 600; line-height: 1.45; color: var(--faint);
        padding: calc(var(--u) * .5) 0; white-space: pre-wrap; transition: color .4s, opacity .4s; }
  .ln.past { opacity: .5; }
  .ln.active { color: var(--ink); }
  .ln.plain { color: var(--sub); font-size: calc(var(--u) * 3); font-weight: 500; }

  /* tracklist promoted into the pane */
  #pane #sides { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #pane #sides .trk { font-size: calc(var(--u) * 3.2); padding: calc(var(--u) * .7) 0; }
  #pane #sides .side-h { font-size: calc(var(--u) * 1.8); margin-bottom: calc(var(--u) * 1.4); }

  /* ---------- PARTY: art-forward ---------- */
  body.party #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2.4); }
  body.party #rail { align-items: center; flex: 0 0 auto; width: 100%; gap: calc(var(--u) * 2); }
  body.party #art-wrap { width: min(62vh, 90vw, var(--art-max)); }
  body.party #needle { width: min(62vh, 90vw, var(--art-max)); }
  body.party #sleeve, body.party #sides, body.party #pane { display: none; }
  body.party #main { align-items: center; text-align: center; flex: 0 0 auto; width: 100%; }
  body.party #id { margin: 0; }
  body.party #track { font-size: calc(var(--u) * 6); -webkit-line-clamp: 1; }
  body.party #artist { font-size: calc(var(--u) * 3); }

  /* ---------- IDLE ---------- */
  #idle { position: fixed; inset: 0; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 1.5s; }
  body.idle #idle { opacity: 1; }
  body.idle.deep #idle { opacity: .3; }
  #idle-block { position: absolute; left: var(--x, 50%); top: var(--y, 50%); transform: translate(-50%, -50%);
                text-align: center; transition: left 10s ease-in-out, top 10s ease-in-out; }
  #clock { font-size: calc(var(--u) * 13); font-weight: 300; color: #5a5650; letter-spacing: -.02em;
           font-variant-numeric: tabular-nums; }
  #stack { margin-top: calc(var(--u) * 3); width: min(60vw, 100vh); }
  #stack .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(var(--u) * 2);
                font-size: calc(var(--u) * 2.1); color: var(--faint); padding: calc(var(--u) * .5) 0; text-align: left; }
  #stack .row .a { color: var(--dim); }
  #stack .row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- PORTRAIT ---------- */
  @media (max-aspect-ratio: 1/1) {
    #stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    #rail { align-items: center; }
    #art-wrap { width: min(100%, 36vh, var(--art-max)); }
    #needle { width: min(100%, 36vh, var(--art-max)); }
    #rail > #sides { display: none; }
    #track { font-size: calc(var(--u) * 6.6); }
    body.party #art-wrap, body.party #needle { width: min(60vh, 90vw, var(--art-max)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }

  #debug { position: fixed; top: 0; left: 0; z-index: 99; display: none; background: rgba(0,0,0,.85); color: #8f8;
           font: calc(var(--u) * 1.4) monospace; padding: var(--u); white-space: pre; }
</style>
</head>
<body data-view="boot">

<div id="bg"><img id="bgimg" alt=""></div>

<div id="stage">
  <div id="rail">
    <div id="art-wrap"><img id="art" alt=""></div>
    <div id="sleeve"></div>
    <div id="sides"></div>
    <div id="needle" class="off"><span id="npos"></span><div id="bar"><i id="fill"></i></div><span id="ntot"></span></div>
  </div>
  <div id="main">
    <div id="id">
      <div id="track"></div>
      <div id="artist"></div>
      <div id="album"></div>
    </div>
    <div id="pane" data-state="flight">
      <div id="lyr-scroll"><div id="lyr-inner"></div></div>
    </div>
  </div>
</div>

<div id="idle">
  <div id="idle-block"><div id="clock"></div><div id="stack"></div></div>
</div>

<div id="debug"></div>

<script>
/* =================================================================
   CONFIG (incumbent shape: HA base + token, ENTITIES / CLOCK_ENTITIES
   priority, 3 s polling, sane-clock interpolation)
   ================================================================= */
const params = new URLSearchParams(location.search);
const CONFIG = {
  HA_BASE: params.get('ha') || 'http://192.168.1.220:8123',
  TOKEN:   params.get('token') || '',
  ENTITIES: ['media_player.denon_avr_x4800h_3', 'media_player.spotifyplus_chelsea'],
  CLOCK_ENTITIES: ['media_player.denon_avr_x4800h_3',
                   'media_player.plex_music_assistant_music_assistant_plex'],
  POLL_MS: 3000,
  LEAD_DIRECT: 1.0, LEAD_CAST: -12.0,
  POSTURE_ENTITY: 'input_select.nowplaying_posture',   // auto | solo | party (default auto)
  LYRICS_VIA_HA: false,                                // stage-2 pre-wire; stage 1 stays on in-page lrclib
  EMPTY_POLLS_TO_IDLE: 2,        // two empty polls in a row (~6 s): no flicker on a gap
  FAIL_POLLS_TO_IDLE: 20,        // HA unreachable: hold the screen ~60 s
  PAUSE_IDLE_MS: 10 * 60 * 1000, // a record left paused this long goes idle
  DEEP_IDLE_MS:  20 * 60 * 1000, // idle this long dims further
  DRIFT_MS: 2 * 60 * 1000,       // pixel shift while playing / clock hop while idle
  ART_MAX_SCALE: 1.75,           // party art never above ~1.75x its native pixels
  // Optional Hue seam (this, or window.nowplayingHueSync), called once per art load with the sampled {r,g,b}. The screen glow
  // is CSS only and never drives lights; only this hook may.
  HUE_HOOK: null,
};
const URL_POSTURE = ['solo', 'party'].includes(params.get('posture')) ? params.get('posture') : null;
const MANUAL_LEAD = params.has('lead') ? parseFloat(params.get('lead')) : null;
const DEBUG = params.has('debug');
const HA = CONFIG.HA_BASE, TOKEN = CONFIG.TOKEN;
const ENTITIES = CONFIG.ENTITIES, CLOCK_ENTITIES = CONFIG.CLOCK_ENTITIES;

const $ = id => document.getElementById(id);
const bodyEl = document.body;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
const artEl = $('art'), bgImg = $('bgimg'), artWrap = $('art-wrap');
const trackEl = $('track'), artistEl = $('artist'), albumEl = $('album'), idEl = $('id');
const sleeveEl = $('sleeve'), sidesEl = $('sides'), railEl = $('rail'), paneEl = $('pane'), needleEl = $('needle');
const lyrInner = $('lyr-inner'), lyrScroll = $('lyr-scroll'), stackEl = $('stack'), clockEl = $('clock');
const debugEl = $('debug');
if (DEBUG) debugEl.style.display = 'block';

/* ---------------- state ---------------- */
let lyricsLines = [], lyricsSynced = false, lyricEls = [], activeIdx = -1;
let paneState = 'flight';                 // flight | synced | plain | miss
let currentKey = '', currentTrack = '', currentArtist = '', currentAlbum = '', albumKey = '';
let posBase = 0, posUpdatedAtMs = 0, isPlaying = false, curDuration = 0;
let clockHealthy = true, clockMode = 'direct', clockEntity = '', activeLead = CONFIG.LEAD_DIRECT;
let staticShown = false, userScrolling = false, userScrollTimer = null;
const RESUME_MS = 15000;
let lastEntity = '', lastState = '';
const mbCache = {};
let curInfo = null;                       // {year,label,cat,country,sides:[{label,tracks:[{title,ms}]}]}
let latch = null;                         // {mode:'solo'|'party', album, side}
let selectPosture = 'auto';
let artUrl = '';
const stack = [];
let emptyPolls = 0, failPolls = 0, pausedSince = 0, idleSince = 0, lastDrift = 0, lastSidesHtml = '';

/* ---------------- HA REST ---------------- */
async function fetchState(entity) {
  try {
    const res = await fetch(`${HA}/api/states/${entity}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
    return res.ok ? res.json() : null;
  } catch (e) { return null; }
}
function clockSane(a) {
  const p = a.media_position, d = a.media_duration;
  return typeof p === 'number' && typeof d === 'number' && d > 0 && p >= -1 && p <= d + 2;
}
const sameTrack = (a, title) => !!title && (a.media_title || '') === title;
const currentPosition = () => posBase + (isPlaying ? (Date.now() - posUpdatedAtMs) / 1000 : 0) + activeLead;

/* ---------------- lyrics supply (incumbent in-page lrclib get -> search) ---------------- */
function parseLRC(lrc) {
  const lines = [];
  for (const raw of lrc.split('\n')) {
    const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (!m) continue;
    lines.push({ time: parseInt(m[1]) * 60 + parseFloat(m[2]), text: m[3].trim() });
  }
  return lines.sort((a, b) => a.time - b.time);
}
const plainLines = t => t.split('\n').map(x => ({ time: null, text: x }));
async function fetchLyrics(artist, track, album, duration) {
  if (CONFIG.LYRICS_VIA_HA) {
    try {
      const u = `${HA}/api/lyrics?artist=${encodeURIComponent(artist)}&track=${encodeURIComponent(track)}`
              + (album ? `&album=${encodeURIComponent(album)}` : '')
              + (duration ? `&duration=${Math.round(duration)}` : '');
      const res = await fetch(u, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
      if (res.ok) { const d = await res.json(); if (d && d.lines) return { lines: d.lines, synced: !!d.synced }; }
    } catch (e) {}
    return null;
  }
  try {
    let getUrl = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}`;
    if (album) getUrl += `&album_name=${encodeURIComponent(album)}`;
    if (duration) getUrl += `&duration=${Math.round(duration)}`;
    let res = await fetch(getUrl);
    let data = res.ok ? await res.json() : null;
    if (data && data.syncedLyrics) return { lines: parseLRC(data.syncedLyrics), synced: true };
    res = await fetch(`https://lrclib.net/api/search?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}`);
    const list = res.ok ? await res.json() : null;
    if (list && list.length) {
      for (const it of list) if (it.syncedLyrics) return { lines: parseLRC(it.syncedLyrics), synced: true };
      for (const it of list) if (it.plainLyrics) return { lines: plainLines(it.plainLyrics), synced: false };
    }
    if (data && data.plainLyrics) return { lines: plainLines(data.plainLyrics), synced: false };
  } catch (e) {}
  return null;
}
function renderLyrics(lines, synced) {
  lyrInner.innerHTML = ''; lyricEls = []; activeIdx = -1; staticShown = false;
  if (!lines || !lines.length) return;
  for (const line of lines) {
    const d = document.createElement('div');
    d.className = synced ? 'ln' : 'ln plain';
    d.textContent = line.text || '';
    lyrInner.appendChild(d); lyricEls.push(d);
  }
  lyrScroll.scrollTop = 0;
}
function scrollToLine(idx) {
  if (idx < 0 || idx >= lyricEls.length || userScrolling) return;
  const e = lyricEls[idx];
  lyrScroll.scrollTop = e.offsetTop - (lyrScroll.clientHeight / 2) + (e.offsetHeight / 2);
}
function updateActiveLineByTime(pos) {
  if (!lyricsSynced || !lyricsLines.length || !lyricEls.length) return;
  let idx = -1;
  for (let i = 0; i < lyricsLines.length; i++) { if (lyricsLines[i].time <= pos) idx = i; else break; }
  if (idx === activeIdx) return;
  activeIdx = idx;
  for (let i = 0; i < lyricEls.length; i++)
    lyricEls[i].className = i < idx ? 'ln past' : i === idx ? 'ln active' : 'ln';
  scrollToLine(idx);
}
function showStaticLyrics() {
  if (staticShown) return;
  staticShown = true; activeIdx = -1;
  for (const e of lyricEls) e.className = 'ln plain';
  lyrScroll.scrollTop = 0;
}

/* ---------------- posture: latched per side, overridable ---------------- */
function locate() {               // where is the current track inside the MB tracklist?
  if (!curInfo || !curInfo.sides) return null;
  const k = norm(currentTrack);
  for (let s = 0; s < curInfo.sides.length; s++) {
    const ts = curInfo.sides[s].tracks;
    for (let t = 0; t < ts.length; t++) if (norm(ts[t].title) === k) return { s, t };
  }
  return null;
}
function reconcileLatch() {       // new album or new side clears the latch; unknown side adopts when learnt
  if (!latch) return;
  const loc = locate();
  if (latch.album !== albumKey) { latch = null; return; }
  if (loc) {
    if (latch.side == null) latch.side = loc.s;
    else if (latch.side !== loc.s) latch = null;
  }
}
function effectivePosture() {
  if (URL_POSTURE) return URL_POSTURE;
  if (selectPosture === 'solo' || selectPosture === 'party') return selectPosture;
  return latch ? latch.mode : 'solo';
}
function applyPosture() {
  const p = effectivePosture();
  bodyEl.classList.toggle('party', p === 'party');
  bodyEl.dataset.posture = p;
  bodyEl.dataset.latch = latch ? latch.mode : '';
  // pane ladder: tracklist rides in the pane while lyrics are in flight or missed (solo only)
  const inPane = p === 'solo' && (paneState === 'flight' || paneState === 'miss');
  const host = inPane ? paneEl : railEl;
  if (sidesEl.parentNode !== host) { if (inPane) paneEl.appendChild(sidesEl); else railEl.insertBefore(sidesEl, needleEl); }
  paneEl.dataset.state = paneState;
}
function setPane(state) { paneState = state; applyPosture(); }
function settleLyrics(r) {
  if (r && r.lines && r.lines.length) {
    lyricsLines = r.lines; lyricsSynced = !!r.synced;
    renderLyrics(lyricsLines, lyricsSynced);
    if (!latch) latch = { mode: lyricsSynced ? 'solo' : 'party', album: albumKey, side: (locate() || {}).s ?? null };
    setPane(lyricsSynced ? 'synced' : 'plain');
  } else {
    lyricsLines = []; lyricsSynced = false; renderLyrics(null, false);
    if (!latch) latch = { mode: 'party', album: albumKey, side: (locate() || {}).s ?? null };
    setPane('miss');
  }
}

/* ---------------- art: swap only after the new cover has loaded ---------------- */
function loadArt(url) {
  const im = new Image();
  im.onload = () => {
    if (url !== artUrl) return;
    artEl.src = url; bgImg.src = url; artEl.classList.add('on');
    const cap = Math.round(im.naturalWidth * CONFIG.ART_MAX_SCALE / (window.devicePixelRatio || 1));
    document.documentElement.style.setProperty('--art-max', cap + 'px');
    recolourFromArt(im);
  };
  im.onerror = () => {
    if (url !== artUrl) return;
    artEl.classList.remove('on');
    document.documentElement.style.setProperty('--art-glow', 'rgba(0,0,0,0)');
  };
  im.src = url;
}
function recolourFromArt(im) {
  let rgb = null;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 12;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0, 12, 12);
    const d = g.getImageData(0, 0, 12, 12).data;
    let r = 0, gg = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) {
      const mx = Math.max(d[i], d[i+1], d[i+2]), mn = Math.min(d[i], d[i+1], d[i+2]);
      if (mx - mn < 24) continue;
      r += d[i]; gg += d[i+1]; b += d[i+2]; n++;
    }
    if (n) {
      rgb = { r: (r/n)|0, g: (gg/n)|0, b: (b/n)|0 };
      const root = document.documentElement.style;
      root.setProperty('--accent', `rgb(${rgb.r},${rgb.g},${rgb.b})`);
      root.setProperty('--art-glow', `rgba(${rgb.r},${rgb.g},${rgb.b},0.16)`);
    }
  } catch (e) { /* tainted canvas: keep default accent */ }
  syncHue(rgb);
}
// Hue seam, same art-load point as the incumbent's. The page itself makes no light call.
function syncHue(rgb) {
  try { const f = CONFIG.HUE_HOOK || window.nowplayingHueSync; if (typeof f === 'function') f(rgb, artUrl); } catch (e) {}
}

/* ---------------- MusicBrainz sleeve-back + side tracklist ---------------- */
function fmtDur(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
async function enrich(artist, album, key) {
  if (!album) { applyInfo(null, key); return; }
  if (mbCache[key]) { applyInfo(mbCache[key], key); return; }
  try {
    const q = `release:"${album}" AND artist:"${artist}"`;
    let res = await fetch(`https://musicbrainz.org/ws/2/release/?query=${encodeURIComponent(q)}&fmt=json&limit=1`);
    const j = res.ok ? await res.json() : null;
    const rel = j && j.releases && j.releases[0];
    if (!rel) { mbCache[key] = { empty: true }; applyInfo(null, key); return; }
    res = await fetch(`https://musicbrainz.org/ws/2/release/${rel.id}?inc=recordings+labels+artist-credits&fmt=json`);
    const full = res.ok ? await res.json() : rel;
    const li = (full['label-info'] && full['label-info'][0]) || {};
    const info = {
      year: (full.date || rel.date || '').slice(0, 4),
      label: (li.label && li.label.name) || '',
      cat: li['catalog-number'] || '',
      country: full.country || rel.country || '',
      sides: [],
    };
    const media = full.media || [], groups = new Map();
    media.forEach((m, mi) => (m.tracks || []).forEach(t => {
      const L = /^([A-Za-z]+)\d/.exec(t.number || '');
      const gk = L ? 'S' + L[1].toUpperCase() : 'D' + mi;
      if (!groups.has(gk)) groups.set(gk, { label: L ? `Side ${L[1].toUpperCase()}` : (media.length > 1 ? `Disc ${mi + 1}` : ''), tracks: [] });
      groups.get(gk).tracks.push({ title: t.title, ms: t.length || 0 });
    }));
    info.sides = [...groups.values()];
    mbCache[key] = info;
    applyInfo(info, key);
  } catch (e) { applyInfo(null, key); }
}
function applyInfo(info, key) {
  if (key !== albumKey) return;                      // a newer album took over
  curInfo = info && !info.empty ? info : null;
  sleeveEl.textContent = curInfo
    ? [curInfo.year, curInfo.label, curInfo.cat, curInfo.country].filter(Boolean).join(' · ') : '';
  reconcileLatch();
  paintSides(true); paintNeedle(); applyPosture();
}
function paintSides(force) {                          // current side only; repaint only on change
  const loc = locate();
  let html = '';
  if (loc) {
    const side = curInfo.sides[loc.s];
    if (side.label) html += `<div class="side-h">${esc(side.label)}</div>`;
    side.tracks.forEach((t, i) => {
      const cls = i < loc.t ? 'trk done' : i === loc.t ? 'trk now' : 'trk';
      html += `<div class="${cls}"><span class="t">${esc(t.title)}</span><span class="d">${fmtDur(t.ms)}</span></div>`;
    });
  }
  if (force || html !== lastSidesHtml) { sidesEl.innerHTML = html; lastSidesHtml = html; }
}
function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function paintNeedle() {
  if (!currentTrack || !curDuration) { needleEl.classList.add('off'); return; }
  needleEl.classList.remove('off');
  const pos = Math.max(0, Math.min(curDuration, currentPosition()));
  const loc = locate();
  const bar = $('bar'), fill = $('fill');
  bar.querySelectorAll('u').forEach(u => u.remove());
  let frac = pos / curDuration;
  if (loc) {
    const ts = curInfo.sides[loc.s].tracks;
    const total = ts.reduce((a, x) => a + (x.ms || 0), 0);
    if (total > 0 && ts.every(x => x.ms)) {
      let acc = 0;
      for (let i = 0; i < ts.length; i++) {
        if (i === loc.t) frac = (acc + Math.min(pos * 1000, ts[i].ms)) / total;
        acc += ts[i].ms;
        if (i < ts.length - 1) {
          const u = document.createElement('u'); u.style.left = (acc / total * 100).toFixed(2) + '%'; bar.appendChild(u);
        }
      }
    }
  }
  fill.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(2) + '%';
  $('npos').textContent = mmss(pos); $('ntot').textContent = mmss(curDuration);
}

/* ---------------- idle: clock, tonight's stack ---------------- */
function noteStack(artist, title) {
  if (!title) return;
  const last = stack[stack.length - 1];
  if (last && last.title === title && last.artist === artist) return;
  stack.push({ artist, title });
  if (stack.length > 8) stack.shift();
}
function paintStack() {
  stackEl.innerHTML = stack.slice().reverse()
    .map(s => `<div class="row"><span class="t">${esc(s.title)}</span><span class="a">${esc(s.artist)}</span></div>`).join('');
}
function tickClock() {
  clockEl.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (bodyEl.dataset.view === 'idle' && Date.now() - idleSince > CONFIG.DEEP_IDLE_MS) bodyEl.classList.add('deep');
}
function drift(force) {                               // burn-in care; full stop under reduced motion
  if (reduced()) return;
  const now = Date.now();
  if (!force && now - lastDrift < CONFIG.DRIFT_MS) return;
  lastDrift = now;
  const r = n => ((Math.random() * 2 - 1) * n).toFixed(1);
  $('stage').style.transform = `translate(${r(0.6)}vmin, ${r(0.6)}vmin)`;
  const blk = $('idle-block');
  blk.style.setProperty('--x', (30 + Math.random() * 40) + '%');
  blk.style.setProperty('--y', (32 + Math.random() * 36) + '%');
}
function setView(v) {
  if (bodyEl.dataset.view === v) return;
  bodyEl.dataset.view = v;
  bodyEl.classList.toggle('idle', v === 'idle');
  if (v === 'idle') { idleSince = Date.now(); paintStack(); drift(true); tickClock(); }
  else bodyEl.classList.remove('deep');
}
function goIdle(keepTrack) {
  setView('idle');
  isPlaying = false; lastState = 'idle'; lastEntity = '';
  if (!keepTrack) {
    currentKey = currentTrack = currentArtist = currentAlbum = albumKey = ''; curInfo = null; latch = null;
    lyricsLines = []; lyricsSynced = false; renderLyrics(null, false); paneState = 'flight'; curDuration = 0;
  }
}

/* ---------------- tickers ---------------- */
setInterval(() => {
  const pos = currentPosition();
  if (lyricsSynced && clockHealthy) { staticShown = false; updateActiveLineByTime(pos); }
  else if (lyricsSynced) showStaticLyrics();
  if (DEBUG) debugEl.textContent =
    `display: ${lastEntity}\nclock:   ${clockEntity} [${clockMode}] healthy:${clockHealthy}\n` +
    `state:   ${lastState} playing:${isPlaying}\nposition:${pos.toFixed(1)}/${curDuration}\n` +
    `pane:    ${paneState} posture:${effectivePosture()} latch:${latch ? latch.mode : '-'}`;
}, 200);
setInterval(() => {
  if (bodyEl.dataset.view === 'np') { paintNeedle(); paintSides(false); }
  tickClock(); drift(false);
}, 1000);

/* ---------------- track change ---------------- */
function onTrackChange(attrs) {
  const key = `${currentArtist}|${currentTrack}|${currentAlbum}`;
  currentKey = key;
  // Never leave the previous song's words up: clear now, tracklist rides in the pane until lyrics land.
  lyricsLines = []; lyricsSynced = false; renderLyrics(null, false);
  userScrolling = false; clearTimeout(userScrollTimer);
  noteStack(currentArtist, currentTrack);
  const ak = `${currentArtist}|${currentAlbum}`.toLowerCase();
  if (ak !== albumKey) { albumKey = ak; curInfo = null; sleeveEl.textContent = ''; paintSides(true); enrich(currentArtist, currentAlbum, ak); }
  reconcileLatch();
  setPane('flight');
  document.title = currentTrack ? `${currentTrack} — ${currentArtist}` : 'Vinyl';
  idEl.classList.add('swap');
  setTimeout(() => {
    if (key !== currentKey) return;
    trackEl.textContent = currentTrack; artistEl.textContent = currentArtist; albumEl.textContent = currentAlbum;
    idEl.classList.remove('swap');
  }, reduced() ? 0 : 250);
  if (currentTrack && currentArtist) {
    fetchLyrics(currentArtist, currentTrack, currentAlbum, attrs.media_duration).then(r => {
      if (key === currentKey) settleLyrics(r);          // identity-keyed: stale results are dropped
    });
  } else settleLyrics(null);
}

/* ---------------- main poll ---------------- */
async function update() {
  try {
    const allEnts = ENTITIES.concat(CLOCK_ENTITIES).filter((e, i, a) => a.indexOf(e) === i);
    const [sel, ...got] = await Promise.all([fetchState(CONFIG.POSTURE_ENTITY), ...allEnts.map(fetchState)]);
    const prevSel = selectPosture;
    selectPosture = sel && ['auto', 'solo', 'party'].includes(sel.state) ? sel.state : 'auto';
    const byEnt = {};
    allEnts.forEach((ent, i) => { if (got[i]) byEnt[ent] = { ent, s: got[i], attrs: got[i].attributes || {} }; });
    if (!got.some(Boolean) && !sel) {
      if (++failPolls >= CONFIG.FAIL_POLLS_TO_IDLE) goIdle();
      return;
    }
    failPolls = 0;
    const snaps = ENTITIES.map(e => byEnt[e]).filter(Boolean);
    const chosen =
      snaps.find(x => x.s.state === 'playing' && x.attrs.media_title) ||
      snaps.find(x => x.s.state === 'paused'  && x.attrs.media_title) ||
      snaps.find(x => x.s.state === 'playing' || x.s.state === 'paused') || null;

    if (!chosen) {
      if (++emptyPolls >= (bodyEl.dataset.view === 'boot' ? 1 : CONFIG.EMPTY_POLLS_TO_IDLE)) goIdle();
      return;
    }
    emptyPolls = 0;
    const data = chosen.s, attrs = chosen.attrs;
    lastEntity = chosen.ent; lastState = data.state;
    if (data.state === 'paused') { if (!pausedSince) pausedSince = Date.now(); } else pausedSince = 0;
    if (pausedSince && Date.now() - pausedSince > CONFIG.PAUSE_IDLE_MS) { goIdle(true); return; }
    if (bodyEl.dataset.view !== 'np') setView('np');

    const newTrack = attrs.media_title || '', newArtist = attrs.media_artist || '', newAlbum = attrs.media_album_name || '';
    curDuration = attrs.media_duration || 0;

    // cover
    if (attrs.entity_picture) {
      const u = attrs.entity_picture.startsWith('http') ? attrs.entity_picture : `${HA}${attrs.entity_picture}`;
      if (u !== artUrl) { artUrl = u; loadArt(u); }
    } else if (artUrl) { artUrl = ''; artEl.classList.remove('on'); }

    // clock health (cast-drift fix, unchanged)
    let clk = null, borrowed = false;
    const cands = [chosen.ent].concat(CLOCK_ENTITIES).filter((e, i, a) => a.indexOf(e) === i);
    for (const ent of cands) {
      const c = byEnt[ent];
      if (c && sameTrack(c.attrs, newTrack) && clockSane(c.attrs)) { clk = c; borrowed = ent !== chosen.ent; break; }
    }
    if (clk) {
      clockHealthy = true; clockEntity = clk.ent; clockMode = borrowed ? 'cast' : 'direct';
      posBase = clk.attrs.media_position || 0;
      posUpdatedAtMs = clk.attrs.media_position_updated_at ? Date.parse(clk.attrs.media_position_updated_at) : Date.now();
      isPlaying = data.state === 'playing';
      activeLead = MANUAL_LEAD !== null ? MANUAL_LEAD : (borrowed ? CONFIG.LEAD_CAST : CONFIG.LEAD_DIRECT);
    } else { clockHealthy = false; clockEntity = '(none)'; clockMode = 'static'; isPlaying = false; }

    if (newTrack !== currentTrack || newArtist !== currentArtist || newAlbum !== currentAlbum || !currentKey) {
      currentTrack = newTrack; currentArtist = newArtist; currentAlbum = newAlbum;
      onTrackChange(attrs);
    } else if (selectPosture !== prevSel) applyPosture();
    applyPosture();
  } catch (e) { /* silent retry */ }
}

/* manual scroll pauses auto-follow */
(function () {
  function onScroll() { userScrolling = true; clearTimeout(userScrollTimer);
    userScrollTimer = setTimeout(() => { userScrolling = false; }, RESUME_MS); }
  ['wheel', 'touchstart', 'touchmove'].forEach(ev => lyrScroll.addEventListener(ev, onScroll, { passive: true }));
})();

tickClock();
update();
setInterval(update, CONFIG.POLL_MS);
</script>
</body>
